services:
  - type: web
    name: waypoint
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build    
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: EMBED_SIMULATOR
        value: "true" # runs the simulator as a child process of this same service (PRD §4.1)
      - key: ADMIN_TOKEN
        generateValue: true # copy this from the Render dashboard's Environment tab for the live-controls panel
      - key: FLEET_SIZE
        value: "15"
      - key: UPDATE_INTERVAL_MS
        value: "5000"
      - key: PAYLOAD_BYTES
        value: "0"
      - key: NODE_ENV
        value: production
    # PORT is injected automatically by Render; the backend reads it from
    # process.env.PORT (packages/backend/src/config.ts).
